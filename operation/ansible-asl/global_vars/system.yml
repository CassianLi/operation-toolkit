---
# 系统配置变量

# Python版本要求
min_python_version: 38

# 服务器配置
# server_config:
#   timezone: "Asia/Shanghai"
#   locale: "zh_CN.UTF-8"

# 应用目录配置 - 仅包含应用相关的目录
# 注意：系统原生目录（如 /var/log, /etc/*, /tmp 等）的权限配置
# 应该在 groups.yml 中的 group_permissions 部分进行设置
app_directories:
  "/usr/local/src":
    owner: "root"
    group: "developers"
    mode: "0755"
  "/opt":
    owner: "root"
    group: "developers"
    mode: "0764"
  "/opt/java-apps":
    owner: "root"
    group: "developers"
    mode: "0775"
  "/opt/python-apps":
    owner: "root"
    group: "developers"
    mode: "0775"
  "/opt/go-apps":
    owner: "root"
    group: "developers"
    mode: "0775"
  "/opt/docker-apps":
    owner: "root"
    group: "developers"
    mode: "0775"
  "/data":
    owner: "root"
    group: "developers"
    mode: "0775"
  "/backup":
    owner: "root"
    group: "developers"
    mode: "0775"
  "/mnt/static":
    owner: "root"
    group: "developers"
    mode: "0775"
