---
# 用户组配置变量

# 用户组基本信息配置
user_groups:
  - name: developers
    gid: 2001
    description: "开发人员用户组"
  - name: operations
    gid: 2002
    description: "运维人员用户组"
  - name: readonly
    gid: 2003
    description: "只读用户组"

# 用户组权限配置
group_permissions:
  developers:
    name: "开发人员"
    description: "开发人员用户组，拥有代码开发和调试权限"
    directories:
      - path: "/usr/local/src"
        name: "源码目录"
        access: "write"
      - path: "/opt"
        name: "第三方软件目录"
        access: "read"
      - path: "/opt/java-apps"
        name: "Java应用目录"
        access: "write"
      - path: "/opt/python-apps"
        name: "Python应用目录"
        access: "write"
      - path: "/opt/go-apps"
        name: "Go应用目录"
        access: "write"
      - path: "/opt/docker-apps"
        name: "Docker应用目录"
        access: "write"
      - path: "/var/log"
        name: "系统日志目录"
        access: "write"
      - path: "/etc"
        name: "系统配置目录"
        access: "read"
      - path: "/etc/nginx"
        name: "Nginx配置目录"
        access: "write"
      - path: "/etc/yum.repos.d"
        name: "YUM源配置目录"
        access: "read"
      - path: "/etc/docker"
        name: "Docker配置目录"
        access: "write"
      - path: "/tmp"
        name: "临时目录"
        access: "write"
      - path: "/data"
        name: "数据目录"
        access: "write"
      - path: "/backup"
        name: "备份目录"
        access: "write"
    sudo_commands:
      - "/bin/systemctl status *"
      - "/bin/systemctl restart *"
      - "/bin/systemctl stop *"
      - "/bin/systemctl start *"
      - "/bin/top"
      - "/bin/htop"
      - "/bin/ps"
      - "/bin/kill"
      - "/bin/killall"
      - "/usr/bin/tail"
      - "/bin/less"
      - "/bin/cat"
      - "/bin/grep"
      - "/bin/find"
      - "/bin/ls"
      - "/bin/dmesg"
      - "/bin/journalctl"
      - "/usr/bin/lsof"
      - "/bin/netstat"
      - "/bin/ss"
      - "/bin/mount"
      - "/bin/umount"
      - "/usr/bin/docker"
      - "/usr/local/bin/docker-compose"
      - "/usr/bin/docker-compose"
      - "/usr/bin/dnf"
      - "/usr/bin/yum"
      - "/usr/bin/vim"
      - "/usr/bin/vi"
      - "/usr/bin/nano"

  operations:
    name: "运维人员"
    description: "运维人员用户组，拥有系统管理和维护权限"
    directories:
      - path: "/usr/local/src"
        name: "源码目录"
        access: "write"
      - path: "/opt"
        name: "第三方软件目录"
        access: "write"
      - path: "/var/log"
        name: "系统日志目录"
        access: "write"
      - path: "/etc"
        name: "系统配置目录"
        access: "read"
      - path: "/etc/yum.repos.d"
        name: "YUM源配置目录"
        access: "write"
      - path: "/etc/docker"
        name: "Docker配置目录"
        access: "write"
      - path: "/tmp"
        name: "临时目录"
        access: "write"
      - path: "/data"
        name: "数据目录"
        access: "write"
      - path: "/backup"
        name: "备份目录"
        access: "write"
    sudo_commands:
      - "/bin/systemctl"
      - "/usr/bin/service"
      - "/sbin/iptables"
      - "/sbin/ufw"
      - "/bin/mount"
      - "/bin/umount"
      - "/sbin/fdisk"
      - "/sbin/parted"
      - "/bin/top"
      - "/bin/htop"
      - "/bin/ps"
      - "/bin/kill"
      - "/bin/killall"
      - "/usr/bin/tail"
      - "/bin/less"
      - "/bin/cat"
      - "/bin/grep"
      - "/bin/find"
      - "/bin/ls"
      - "/bin/dmesg"
      - "/bin/journalctl"
      - "/usr/bin/lsof"
      - "/bin/netstat"
      - "/bin/ss"
      - "/bin/crontab"
      - "/usr/bin/rsync"
      - "/bin/tar"
      - "/bin/gzip"
      - "/bin/gunzip"
      - "/usr/bin/docker"
      - "/usr/local/bin/docker-compose"
      - "/usr/bin/docker-compose"
      - "/usr/bin/dnf"
      - "/usr/bin/yum"
      - "/usr/bin/vim"
      - "/usr/bin/vi"
      - "/usr/bin/nano"

  readonly:
    name: "只读用户"
    description: "只读用户组，仅拥有查看权限，适用于审计和监控"
    directories:
      - path: "/var/log"
        name: "系统日志目录"
        access: "read"
      - path: "/etc"
        name: "系统配置目录"
        access: "read"
      - path: "/usr/local/src"
        name: "源码目录"
        access: "read"
      - path: "/opt"
        name: "第三方软件目录"
        access: "read"
    sudo_commands:
      - "/bin/systemctl status *"
      - "/bin/top"
      - "/bin/htop"
      - "/bin/ps"
      - "/usr/bin/tail"
      - "/bin/less"
      - "/bin/cat"
      - "/bin/grep"
      - "/bin/find"
      - "/bin/ls"
      - "/bin/dmesg"
      - "/bin/journalctl"
      - "/usr/bin/lsof"
      - "/bin/netstat"
      - "/bin/ss"
      - "/usr/bin/last"
      - "/usr/bin/lastlog"
      - "/usr/bin/who"
      - "/usr/bin/w"
      - "/usr/bin/id"
