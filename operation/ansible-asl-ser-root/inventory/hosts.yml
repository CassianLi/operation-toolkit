---
# 服务器清单文件
# 用于配置root权限用户的服务器列表

all:
  children:
    # 开发环境服务器组
    dev_servers:
      hosts:
        asl-dev-ser:
          ansible_host: ser.dev.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-dev-ser"
          server_description: "开发环境服务器"
          env_type: "dev"
        asl-dev-gw:
          ansible_host: gw.dev.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-dev-gw"
          server_description: "开发环境网关服务器"
          env_type: "dev"
        asl-dev-env:
          ansible_host: env.dev.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-dev-env"
          server_description: "开发环境服务器"
          env_type: "dev"

    # 生产环境服务器组
    pro_servers:
      hosts:
        asl-pro-ser:
          ansible_host: ser.pro.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-pro-ser"
          server_description: "生产环境服务器"
          env_type: "pro"
        asl-pro-gw:
          ansible_host: gw.pro.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-pro-gw"
          server_description: "生产环境网关服务器"
          env_type: "pro"
        asl-pro-env:
          ansible_host: env.pro.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-pro-env"
          server_description: "生产环境服务器"
          env_type: "pro"
        asl-pro-basic:
          ansible_host: basic.pro.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-pro-basic"
          server_description: "生产环境基础服务器"
          env_type: "pro"
        asl-pro-bg:
          ansible_host: bg.pro.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-pro-bg"
          server_description: "生产环境后台服务器"
          env_type: "pro"
        asl-pro-mq:
          ansible_host: mq.pro.asl.com
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          server_name: "asl-pro-mq"
          server_description: "生产环境消息队列服务器"
          env_type: "pro"
        asl-pro-vault:
          ansible_host: vault.pro.asl.com
          ansible_user: ecs-user
          ansible_ssh_private_key_file: ~/.ssh/sysafari-pro-vault-key.pem
          # 该机 Python 在 /usr/local/bin/python（3.12），需单独指定（全局 /usr/bin/python3 可能为旧版，会导致 setup 模块 SyntaxError: future feature annotations is not defined）
          ansible_python_interpreter: /usr/local/bin/python
          server_name: "asl-pro-vault"
          server_description: "生产环境Vault服务器(备份数据库，以及其他补充服务)"
          env_type: "pro"

  vars:
    # Python解释器路径
    ansible_python_interpreter: /usr/bin/python3

    # SSH连接配置
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    # 连接超时配置
    ansible_connect_timeout: 30
    ansible_command_timeout: 30

    # 重试配置
    ansible_retries: 3
    ansible_retry_delay: 5
