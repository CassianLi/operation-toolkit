---
# Root用户清理主任务文件

- name: 显示清理信息
  debug:
    msg: |
      开始清理Root权限用户
      服务器: {{ inventory_hostname }}
      清理模式: {{ cleanup_mode | default('ssh_only') }}
      目标用户数量: {{ target_user_list | length }}
      目标用户列表: {{ target_user_list | join(', ') }}

- name: 创建清理日志目录
  file:
    path: /var/log/ansible-root-users
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - logging
    - directories

- name: 记录清理开始日志
  lineinfile:
    path: /var/log/ansible-root-users/cleanup-start.log
    line: "{{ ansible_date_time.iso8601 }} - Starting cleanup for users: {{ target_user_list | join(', ') }} on {{ inventory_hostname }} ({{ ansible_host }}) - Mode: {{ cleanup_mode | default('ssh_only') }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  tags:
    - logging
    - audit

# SSH密钥清理任务
# ssh_only 模式：仅删除 authorized_keys 文件，保留 .ssh 目录
# full 模式：删除整个 .ssh 目录
- name: 删除 authorized_keys 文件（仅清理SSH密钥）
  file:
    path: "/home/{{ item }}/.ssh/authorized_keys"
    state: absent
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'ssh_only'
  tags:
    - ssh
    - ssh_keys
    - cleanup_ssh_keys

- name: 删除用户SSH目录（完全删除）
  file:
    path: "/home/{{ item }}/.ssh"
    state: absent
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - ssh
    - ssh_keys
    - cleanup_ssh_keys

- name: 记录SSH密钥清理日志
  lineinfile:
    path: /var/log/ansible-root-users/ssh-cleanup.log
    line: "{{ ansible_date_time.iso8601 }} - Cleaned SSH keys for user: {{ item }} on {{ inventory_hostname }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  loop: "{{ target_user_list }}"
  tags:
    - logging
    - audit

# 完全删除模式的任务
- name: 删除用户sudo配置
  file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - sudo
    - sudo_config
    - cleanup_sudo_config

- name: 记录sudo配置清理日志
  lineinfile:
    path: /var/log/ansible-root-users/sudo-cleanup.log
    line: "{{ ansible_date_time.iso8601 }} - Cleaned sudo config for user: {{ item }} on {{ inventory_hostname }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - logging
    - audit

- name: 删除用户主目录
  file:
    path: "/home/{{ item }}"
    state: absent
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - users
    - cleanup_users
    - cleanup_home

- name: 记录主目录清理日志
  lineinfile:
    path: /var/log/ansible-root-users/home-cleanup.log
    line: "{{ ansible_date_time.iso8601 }} - Cleaned home directory for user: {{ item }} on {{ inventory_hostname }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - logging
    - audit

- name: 删除用户账户
  user:
    name: "{{ item }}"
    state: absent
    remove: yes
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - users
    - cleanup_users

- name: 记录用户账户删除日志
  lineinfile:
    path: /var/log/ansible-root-users/user-deletion.log
    line: "{{ ansible_date_time.iso8601 }} - Deleted user account: {{ item }} on {{ inventory_hostname }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - logging
    - audit

- name: 删除用户同名组
  group:
    name: "{{ item }}"
    state: absent
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - users
    - cleanup_users
    - groups

- name: 记录用户组删除日志
  lineinfile:
    path: /var/log/ansible-root-users/group-deletion.log
    line: "{{ ansible_date_time.iso8601 }} - Deleted user group: {{ item }} on {{ inventory_hostname }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'
  tags:
    - logging
    - audit

# 验证清理结果
- name: 验证用户清理结果
  getent:
    database: passwd
    key: "{{ item }}"
  register: user_cleanup_verification
  loop: "{{ target_user_list }}"
  failed_when: false
  changed_when: false
  when: cleanup_mode == 'full'

- name: 显示用户清理验证结果
  debug:
    msg: "用户 {{ item.item }} 清理验证: {{ '已删除' if item.failed else '仍存在' }}"
  loop: "{{ user_cleanup_verification.results }}"
  when: cleanup_mode == 'full'

- name: 验证SSH密钥清理结果
  stat:
    path: "/home/{{ item }}/.ssh/authorized_keys"
  register: ssh_cleanup_verification
  loop: "{{ target_user_list }}"

- name: 显示SSH密钥清理验证结果
  debug:
    msg: "用户 {{ item.item }} SSH密钥清理验证: {{ '已清理' if not item.stat.exists else '仍存在' }}"
  loop: "{{ ssh_cleanup_verification.results }}"

- name: 验证sudo配置清理结果
  stat:
    path: "/etc/sudoers.d/{{ item }}"
  register: sudo_cleanup_verification
  loop: "{{ target_user_list }}"
  when: cleanup_mode == 'full'

- name: 显示sudo配置清理验证结果
  debug:
    msg: "用户 {{ item.item }} sudo配置清理验证: {{ '已清理' if not item.stat.exists else '仍存在' }}"
  loop: "{{ sudo_cleanup_verification.results }}"
  when: cleanup_mode == 'full'

- name: 显示清理完成信息
  debug:
    msg: |
      Root权限用户清理完成！
      服务器: {{ inventory_hostname }}
      清理模式: {{ cleanup_mode | default('ssh_only') }}
      清理用户: {{ target_user_list | join(', ') }}
      清理时间: {{ ansible_date_time.iso8601 }}

      清理内容:
      {% if cleanup_mode == 'full' %}
      - 用户账户: 已删除
      - 用户组: 已删除
      - 主目录: 已删除
      - SSH密钥: 已清理
      - sudo配置: 已清理
      {% else %}
      - SSH密钥: 已清理（保留用户账户和其他配置）
      {% endif %}

      安全提醒：
      1. 请确认清理操作符合安全策略
      2. 建议备份重要数据
      3. 定期审计清理操作日志
      4. 监控系统日志: /var/log/secure
