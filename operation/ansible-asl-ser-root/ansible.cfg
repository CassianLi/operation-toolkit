[defaults]
# 指定服务器清单文件
inventory = inventory/hosts.yml

# 禁用SSH主机密钥检查（生产环境建议启用）
host_key_checking = False

# 设置连接超时时间
timeout = 30

# 设置并行执行的任务数
forks = 5

# 设置事实收集模式
gathering = smart

# 指定角色文件路径
roles_path = roles

# 指定日志文件路径
log_path = logs/ansible.log

# 设置SSH连接参数
[ssh_connection]
# SSH连接超时时间
ssh_args = -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPersist=60s

# 禁用SSH连接复用（可选）
# control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# 设置SSH重试次数
retries = 3

# 设置SSH重试间隔
retry_delay = 5

[privilege_escalation]
# 使用sudo进行权限提升
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[colors]
# 设置输出颜色
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
