# 日志配置
version: 1
disable_existing_loggers: false

# 格式化器配置
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s:%(lineno)d: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  colored:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

# 处理器配置
handlers:
  # 控制台输出
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: colored
    stream: ext://sys.stdout

  # 文件输出
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/cleanup.log
    # 10MB
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

  # 错误日志文件
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    # 10MB
    maxBytes: 10485760
    backupCount: 3
    encoding: utf8

  # 性能监控日志
  performance_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/performance.log
    # 5MB
    maxBytes: 5242880
    backupCount: 2
    encoding: utf8

# 日志器配置
loggers:
  # 根日志器
  "":
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  # 清理管理器
  cleanup_manager:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  # 数据库连接器
  db_connector:
    level: INFO
    handlers: [file, error_file]
    propagate: false

  # 数据分析器
  data_analyzer:
    level: INFO
    handlers: [file, error_file]
    propagate: false

  # 备份管理器
  backup_manager:
    level: INFO
    handlers: [file, error_file]
    propagate: false

  # 清理执行器
  cleanup_executor:
    level: INFO
    handlers: [file, error_file, performance_file]
    propagate: false

  # 性能监控
  performance_monitor:
    level: INFO
    handlers: [performance_file]
    propagate: false

# 根配置
root:
  level: INFO
  handlers: [console, file, error_file]
