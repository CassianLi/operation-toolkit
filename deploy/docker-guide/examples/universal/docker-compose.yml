# Docker Compose 通用权限管理模板
# 适用于任何服务的部署，通过用户映射解决权限问题

version: '3.8'

services:
  # 服务名称 - 根据实际需求修改
  your-service:
    # 镜像配置 - 根据实际需求修改
    image: your-image:tag

    # 容器名称 - 根据实际需求修改
    container_name: your-service-container

    # 重启策略
    restart: unless-stopped

    # 关键配置：用户映射到宿主机用户组
    # 这将容器内用户映射到宿主机用户组，解决权限问题
    user: "${HOST_USER_ID}:${HOST_GROUP_ID}"

    # 环境变量配置
    environment:
      # 可选：传递用户信息到容器内
      - USER_ID=${HOST_USER_ID}
      - GROUP_ID=${HOST_GROUP_ID}
      - USER_NAME=${HOST_USER_NAME}
      - GROUP_NAME=${HOST_GROUP_NAME}

      # 服务特定的环境变量 - 根据实际需求修改
      - SERVICE_ENV=production
      - TZ=${TZ:-Asia/Shanghai}

    # 端口映射 - 根据实际需求修改
    ports:
      - "${SERVICE_PORT:-8080}:${CONTAINER_PORT:-80}"

    # 卷挂载配置
    volumes:
      # 数据目录 - 持久化存储
      - ./data:/var/lib/your-service:rw

      # 日志目录 - 日志文件存储
      - ./logs:/var/log/your-service:rw

      # 配置目录 - 自定义配置
      - ./config:/etc/your-service:ro

      # 备份目录 - 数据备份
      - ./backups:/backups:rw

      # 临时目录 - 临时文件
      - ./tmp:/tmp:rw

    # 网络配置
    networks:
      - service-network

    # 健康检查 - 根据实际需求修改
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTAINER_PORT:-80}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

# 网络配置
networks:
  service-network:
    driver: bridge
    name: your-service-network

# 卷配置 (可选 - 使用命名卷)
volumes:
  service-data:
    driver: local
    name: your-service-data
  service-logs:
    driver: local
    name: your-service-logs
