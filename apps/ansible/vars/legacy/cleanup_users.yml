---
# Root权限用户清理配置变量
# 包含需要清理的用户配置信息

# 清理模式配置
# 支持的模式：
# - full: 完全删除用户账户（用户、组、主目录、sudo配置、SSH密钥）
# - ssh_only: 仅清理SSH密钥，保留用户账户和其他配置
cleanup_mode: "ssh_only"

# 目标用户列表（可选，也可以通过命令行参数指定）
# 如果在此处配置，则不需要通过命令行参数指定
# 格式：用户名列表，用逗号分隔
# target_users: "user1,user2,user3"

# 清理配置选项
cleanup_options:
  # 是否备份用户数据（仅完全删除模式有效）
  backup_user_data: false

  # 备份目录
  backup_directory: "/var/backups/ansible-root-users"

  # 是否强制清理（跳过确认）
  force_cleanup: false

  # 清理前是否发送通知
  send_notification: false

  # 通知邮件列表
  notification_emails: []

  # 清理后是否重启相关服务
  restart_services: false

# 安全配置
security:
  # 清理前验证
  pre_cleanup_verification: true

  # 清理后验证
  post_cleanup_verification: true

  # 记录详细日志
  detailed_logging: true

  # 清理操作审计
  audit_cleanup: true

# 清理范围配置
cleanup_scope:
  # 清理SSH密钥
  ssh_keys: true

  # 清理sudo配置
  sudo_config: true

  # 清理用户主目录
  home_directory: true

  # 清理用户账户
  user_account: true

  # 清理用户组
  user_group: true
# 示例配置（注释掉，仅供参考）
# 以下是一些使用示例，实际使用时请根据需要进行配置

# 示例1：仅清理SSH密钥，保留用户账户
# cleanup_mode: "ssh_only"
# target_users: "test_user1,test_user2"

# 示例2：完全删除用户账户
# cleanup_mode: "full"
# target_users: "old_user1,old_user2"

# 示例3：带备份的完全删除
# cleanup_mode: "full"
# target_users: "temp_user1,temp_user2"
# cleanup_options:
#   backup_user_data: true
#   backup_directory: "/var/backups/user-cleanup-{{ ansible_date_time.date }}"

# 注意事项：
# 1. 清理操作不可逆，请谨慎使用
# 2. 建议在测试环境先验证清理脚本
# 3. 重要数据请提前备份
# 4. 生产环境使用前请充分测试
# 5. 建议使用 ssh_only 模式进行SSH密钥清理
# 6. 完全删除模式会删除所有用户数据，请确认后再使用
