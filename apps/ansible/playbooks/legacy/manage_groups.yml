---
# 用户组管理专用playbook
# 使用方法：
# ansible-playbook playbooks/manage_groups.yml -e "target_env=dev"  # 开发环境
# ansible-playbook playbooks/manage_groups.yml -e "target_env=pro"  # 生产环境
# ansible-playbook playbooks/manage_groups.yml  # 默认开发环境

- name: 管理用户组和权限
  hosts: "{{ target_env | default('dev') }}_servers"
  become: yes
  gather_facts: yes

  vars_files:
    - ../../vars/legacy/groups.yml
    - ../../vars/legacy/system.yml

  pre_tasks:
    - name: 显示目标环境信息
      debug:
        msg: |
          目标环境: {{ target_env | default('dev') }}
          服务器组: {{ target_env | default('dev') }}_servers
          当前服务器: {{ server_name }} ({{ ansible_host }})

    - name: 显示变量加载状态
      debug:
        msg: "group_permissions 变量: {{ group_permissions is defined }}"

  roles:
    - role: legacy/group_management
      tags:
        - group_management
        - groups
        - sudo
        - directories
        - permissions
        - emergency_fix

  post_tasks:
    - name: 验证用户组创建
      command: getent group {{ item.name }}
      register: group_check
      loop: "{{ user_groups }}"
      changed_when: false

    - name: 显示用户组验证结果
      debug:
        msg: "用户组 {{ item.item.name }} 状态: {{ '存在' if item.rc == 0 else '不存在' }}"
      loop: "{{ group_check.results }}"

    - name: 验证sudo配置
      command: visudo -c
      register: sudo_check
      changed_when: false

    - name: 显示sudo配置验证结果
      debug:
        msg: "sudo配置验证: {{ '通过' if sudo_check.rc == 0 else '失败' }}"

    - name: 显示配置完成信息
      debug:
        msg: |
          用户组管理完成！
          服务器: {{ server_name }}
          用户组: {{ user_groups | map(attribute='name') | list | join(', ') }}
