---
# Root用户管理主任务文件

- name: 显示配置信息
  debug:
    msg: |
      开始配置Root权限用户
      服务器: {{ inventory_hostname }}
      用户数量: {{ root_users | length }}
      用户列表: {{ root_users | map(attribute='username') | list | join(', ') }}

- name: 确保SSH服务运行
  service:
    name: sshd
    state: started
    enabled: yes
  tags:
    - ssh
    - services

- name: 检查用户是否已存在
  getent:
    database: passwd
    key: "{{ item.username }}"
  register: user_exists_check
  loop: "{{ root_users }}"
  failed_when: false
  changed_when: false
  tags:
    - users
    - root_users

- name: 创建用户同名组
  group:
    name: "{{ item.username }}"
    state: present
  loop: "{{ root_users }}"
  tags:
    - users
    - root_users
    - groups

- name: 创建或更新Root权限用户账户
  user:
    name: "{{ item.0.username }}"
    comment: "{{ item.0.full_name }}"
    shell: "{{ item.0.shell | default('/bin/bash') }}"
    home: "{{ item.0.home | default('/home/' + item.0.username) }}"
    create_home: "{{ item.0.create_home | default(true) }}"
    group: "{{ item.0.username }}"
    state: present
    system: false
    update_password: "{{ 'on_create' if item.1.failed else 'always' }}"
  loop: "{{ root_users | zip(user_exists_check.results) | list }}"
  tags:
    - users
    - root_users

- name: 显示用户创建/更新状态
  debug:
    msg: "用户 {{ item.0.username }} {{ '已更新' if not item.1.failed else '已创建' }}"
  loop: "{{ root_users | zip(user_exists_check.results) | list }}"
  tags:
    - users
    - root_users

- name: 验证用户主组设置
  command: id {{ item.username }}
  register: user_id_check
  loop: "{{ root_users }}"
  changed_when: false

- name: 显示用户主组信息
  debug:
    msg: "用户 {{ item.item.username }} 主组信息: {{ item.stdout }}"
  loop: "{{ user_id_check.results }}"
  tags:
    - users
    - root_users
    - verification

- name: 创建SSH目录
  file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0700"
  loop: "{{ root_users }}"
  when: item.ssh_keys is defined and item.ssh_keys | length > 0
  tags:
    - ssh
    - ssh_keys

- name: 配置SSH公钥
  authorized_key:
    user: "{{ item.0.username }}"
    key: "{{ item.1 }}"
    state: present
    exclusive: false
  loop: "{{ root_users | subelements('ssh_keys') }}"
  when: item.0.ssh_keys is defined and item.0.ssh_keys | length > 0
  tags:
    - ssh
    - ssh_keys

- name: 设置SSH目录权限
  file:
    path: "/home/{{ item.username }}/.ssh"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0700"
  loop: "{{ root_users }}"
  when: item.ssh_keys is defined and item.ssh_keys | length > 0
  tags:
    - ssh
    - ssh_keys

- name: 设置authorized_keys文件权限
  file:
    path: "/home/{{ item.username }}/.ssh/authorized_keys"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: "0600"
  loop: "{{ root_users }}"
  when: item.ssh_keys is defined and item.ssh_keys | length > 0
  tags:
    - ssh
    - ssh_keys

- name: 创建sudo配置目录
  file:
    path: /etc/sudoers.d
    state: directory
    mode: "0750"
  tags:
    - sudo
    - sudo_config

- name: 生成sudo配置文件
  template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ item.username }}"
    owner: root
    group: root
    mode: "0440"
    backup: yes
  loop: "{{ root_users }}"
  tags:
    - sudo
    - sudo_config

- name: 验证sudo配置语法
  command: visudo -c -f "/etc/sudoers.d/{{ item.username }}"
  register: sudo_syntax_check
  loop: "{{ root_users }}"
  changed_when: false
  tags:
    - sudo
    - sudo_config

- name: 显示sudo配置验证结果
  debug:
    msg: "sudo配置文件 {{ item.item.username }} 语法检查: {{ '通过' if item.rc == 0 else '失败' }}"
  loop: "{{ sudo_syntax_check.results }}"
  tags:
    - sudo
    - sudo_config

- name: 配置SSH安全设置
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    backup: yes
  loop:
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
    - { regexp: "^#?PubkeyAuthentication", line: "PubkeyAuthentication yes" }
    - {
        regexp: "^#?PermitRootLogin",
        line: "PermitRootLogin prohibit-password",
      }
    - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
    - { regexp: "^#?LoginGraceTime", line: "LoginGraceTime 60" }
  notify: restart sshd
  tags:
    - ssh
    - ssh_security

- name: 设置用户环境变量
  lineinfile:
    path: "/home/{{ item.0.username }}/.bashrc"
    line: "{{ item.1 }}"
    create: yes
    owner: "{{ item.0.username }}"
    group: "{{ item.0.username }}"
    mode: "0644"
  loop: "{{ root_users | product(['export EDITOR=vim', 'export PAGER=less', 'export HISTSIZE=10000', 'export HISTFILESIZE=10000']) | list }}"
  tags:
    - environment
    - user_config

- name: 创建操作日志目录
  file:
    path: /var/log/ansible-root-users
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - logging
    - directories

- name: 记录用户创建日志
  lineinfile:
    path: /var/log/ansible-root-users/user-creation.log
    line: "{{ ansible_date_time.iso8601 }} - Created root user: {{ item.username }} ({{ item.full_name }}) on {{ inventory_hostname }}"
    create: yes
    owner: root
    group: root
    mode: "0644"
  loop: "{{ root_users }}"
  tags:
    - logging
    - audit

- name: 显示配置完成信息
  debug:
    msg: |
      Root权限用户配置完成！
      服务器: {{ inventory_hostname }}
      配置用户: {{ root_users | map(attribute='username') | list | join(', ') }}
      配置时间: {{ ansible_date_time.iso8601 }}

      安全提醒：
      1. 请确保SSH密钥安全
      2. 定期审计用户操作
      3. 建议定期轮换SSH密钥
      4. 监控sudo操作日志
