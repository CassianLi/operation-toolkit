---
# Root用户管理角色处理器

- name: restart sshd
  service:
    name: sshd
    state: restarted
  listen: "restart sshd"
  tags:
    - ssh
    - services

- name: reload sudo
  command: "sudo -k"
  listen: "reload sudo"
  tags:
    - sudo
    - services

- name: validate sudoers
  command: "visudo -c"
  listen: "validate sudoers"
  tags:
    - sudo
    - validation
