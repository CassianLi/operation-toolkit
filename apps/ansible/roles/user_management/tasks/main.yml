---
# 用户管理主任务文件

- name: 创建用户账户
  user:
    name: "{{ item.username }}"
    comment: "{{ item.full_name }}"
    group: "{{ item.primary_group }}"
    groups: "{{ item.secondary_groups }}"
    shell: "{{ item.shell }}"
    home: "/home/{{ item.username }}"
    create_home: yes
    state: present
  loop: "{{ users }}"
  tags:
    - users

- name: 创建SSH目录
  file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.primary_group }}"
    mode: "0700"
  loop: "{{ users }}"
  when: item.ssh_keys is defined and item.ssh_keys | length > 0
  tags:
    - ssh_keys

- name: 配置SSH公钥
  authorized_key:
    user: "{{ item.0.username }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ users | subelements('ssh_keys') }}"
  when: item.0.ssh_keys is defined and item.0.ssh_keys | length > 0
  tags:
    - ssh_keys

- name: 设置SSH目录权限
  file:
    path: "/home/{{ item.username }}/.ssh"
    owner: "{{ item.username }}"
    group: "{{ item.primary_group }}"
    mode: "0700"
  loop: "{{ users }}"
  when: item.ssh_keys is defined and item.ssh_keys | length > 0
  tags:
    - ssh_keys

- name: 设置authorized_keys文件权限
  file:
    path: "/home/{{ item.username }}/.ssh/authorized_keys"
    owner: "{{ item.username }}"
    group: "{{ item.primary_group }}"
    mode: "0600"
  loop: "{{ users }}"
  when: item.ssh_keys is defined and item.ssh_keys | length > 0
  tags:
    - ssh_keys
